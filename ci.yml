name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest

    env:
      # Valores só para o ambiente de CI (SQLite, sem DB_NAME). Não são segredos.
      DJANGO_SECRET_KEY: chave-apenas-para-ci-nao-e-segredo
      DJANGO_DEBUG: "True"

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install "Django>=5.2,<5.3" python-dotenv coverage

      - name: Verificar configuração do Django
        run: python manage.py check

      - name: Garantir que as migrations estão em dia
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar os testes com cobertura
        run: coverage run --source=. manage.py test --verbosity 2

      - name: Relatório de cobertura (mínimo de 80%)
        run: >
          coverage report --fail-under=80
          --omit="*/migrations/*,manage.py,config/wsgi.py,config/asgi.py,*/tests.py,*/test_*.py"
