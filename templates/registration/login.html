{% extends "base.html" %}
{% block titulo %}Entrar · Comais{% endblock %}
{% block conteudo %}
<h1>Entrar</h1>
<form method="post" class="stack" novalidate>
  {% csrf_token %}
  {% if form.errors %}
  <div class="msg error" role="alert"><span aria-hidden="true">✖</span><span>Login ou senha incorretos.</span></div>
  {% endif %}
  <div class="field">
    <label for="id_username">Login</label>
    <input type="text" name="username" id="id_username" autocomplete="username" autocapitalize="none" required autofocus>
  </div>
  <div class="field">
    <label for="id_password">Senha</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
  </div>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn" type="submit">Entrar</button>
</form>
{% endblock %}
